get:
  summary: Search for event subscriptionIds with pending events
  description: |
    Search for EventSubscriptionIds with events that are newer than the
    specified parameters.
  operationId: searchEventSubscription
  parameters:
    - $ref: ../components/parameters/correlation_id.yaml
    - $ref: ../components/parameters/cursor.yaml
    - $ref: ../components/parameters/limit.yaml
    - $ref: ../components/parameters/from_event_date.yaml
  tags:
    - Event Subscription
  responses:
    '200':
      description: |
        List of event subscriptions with events that are newer than the specified
        parameters
      headers:
        Correlation-Id:
          $ref: ../components/headers/Correlation-Id.yaml
        x-nextCursor:
          $ref: ../components/headers/Next-Cursor.yaml
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/EventSubscription.yaml
    '400':
      $ref: ../components/responses/standard400.yaml
    '401':
      $ref: ../components/responses/standard401.yaml
    '403':
      $ref: ../components/responses/standard403.yaml
    '404':
      $ref: ../components/responses/standard404.yaml
    '500':
      $ref: ../components/responses/standard500.yaml
    '501':
      $ref: ../components/responses/standard501.yaml
    '503':
      $ref: ../components/responses/standard503.yaml
    '504':
      $ref: ../components/responses/standard504.yaml
