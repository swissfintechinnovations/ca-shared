post:
  summary: Send notification
  description: Send notification to consumer.
  operationId: sendEventNotification
  parameters:
    - $ref: ../components/parameters/correlation_in_header.yaml
    - $ref: ../components/parameters/event_type_in_header.yaml
    - $ref: ../components/parameters/event_id_in_header.yaml
    - $ref: ../components/parameters/event_created_in_header.yaml
    - $ref: ../components/parameters/event_subscription_id_in_header.yaml
  tags:
    - Notification Webhook
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/EventNotification.yaml
  responses:
    '202':
      description: event-notification accepted
      headers:
        X-Correlation-ID:
          $ref: ../components/headers/X-Correlation-ID.yaml
    '400':
      $ref: ../components/responses/standard400.yaml
    '404':
      $ref: ../components/responses/standard404.yaml
    '405':
      $ref: ../components/responses/standard405.yaml
    '429':
      $ref: ../components/responses/standard429.yaml
    '500':
      $ref: ../components/responses/standard500.yaml
    '501':
      $ref: ../components/responses/standard501.yaml
    '503':
      $ref: ../components/responses/standard503.yaml
    '504':
      $ref: ../components/responses/standard504.yaml
