get:
  tags:
    - event notifications aggregated polling
  summary: Get event notifications list
  description: Get aggregated event notification list.
  operationId: listEventSubscriptionEventNotifications
  parameters:
    - $ref: ../components/parameters/cursor.yaml
    - $ref: ../components/parameters/limit.yaml
    - $ref: ../components/parameters/correlation_id.yaml
    - $ref: ../components/parameters/event_subscription_id.yaml
    - $ref: ../components/parameters/from_event_date_time.yaml
  responses:
    '200':
      description: List of event notifications.
      headers:
        Correlation-Id:
          $ref: ../components/headers/Correlation-Id.yaml
        Next-Cursor:
          $ref: ../components/headers/Next-Cursor.yaml
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/EventNotification.yaml
    '400':
      $ref: ../components/responses/standard400.yaml
    '401':
      $ref: ../components/responses/standard401.yaml
    '403':
      $ref: ../components/responses/standard403.yaml
    '404':
      $ref: ../components/responses/standard404.yaml
    '405':
      $ref: ../components/responses/standard405.yaml
    '429':
      $ref: ../components/responses/standard429.yaml
    '500':
      $ref: ../components/responses/standard500.yaml
    '501':
      $ref: ../components/responses/standard501.yaml
    '503':
      $ref: ../components/responses/standard503.yaml
    '504':
      $ref: ../components/responses/standard504.yaml
