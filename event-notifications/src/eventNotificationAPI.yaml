openapi: 3.0.0
info:
  version: 1.0.0
  title: event-notification plugin
  description: |
    This specification defines the SFTI Event Notification API standard for secure, and standardized event-based communication
    between financial ecosystem participants. As a cross-stream specification, it provides a generic event notification
    framework used across multiple SFTI repositories, while the stream-specific event types and payload definitions are defined
    and maintained within the respective stream repositories.
  contact:
    email: info@common-api.ch
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://webhook-notification.common-api.ch
externalDocs:
  description: Find out more about SFTI API specifications.
  url: https://www.common-api.ch
tags:
  - name: event subscriptions
    description: |
      Event subscription operations in the context of OAuth2 consent authentication. One subscription is bound to exactly
      one consent and supports create, retrieve, update and delete operations. Multiple event types are managed within the single
      subscription resource.
  - name: event notifications aggregated polling
    description: |
      Aggregated polling operations in the context of Service User authentication, used for catch-up retrieval of event notifications.
security: []
paths:
  /event-subscriptions:
    get:
      tags:
        - event subscriptions
      summary: Get event subscriptions
      description: Get list of event subscriptions.
      operationId: listEventSubscriptions
      parameters:
        - $ref: ./components/parameters/cursor.yaml
        - $ref: ./components/parameters/limit.yaml
        - $ref: ./components/parameters/header/correlation.yaml
      responses:
        '200':
          description: List of event subscriptions.
          headers:
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
            X-Next-Cursor:
              $ref: ./components/headers/X-Next-Cursor.yaml
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./components/schemas/EventSubscription.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '404':
          $ref: ./components/responses/standard404.yaml
        '405':
          $ref: ./components/responses/standard405.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '501':
          $ref: ./components/responses/standard501.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
        '504':
          $ref: ./components/responses/standard504.yaml
    post:
      tags:
        - event subscriptions
      summary: Create event subscription
      description: Create event subscription.
      operationId: createEventSubscription
      parameters:
        - $ref: ./components/parameters/header/correlation.yaml
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./components/schemas/EventSubscription.yaml
      responses:
        '201':
          description: Event subscription created.
          headers:
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
          content:
            application/json:
              schema:
                $ref: ./components/schemas/EventSubscription.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '404':
          $ref: ./components/responses/standard404.yaml
        '405':
          $ref: ./components/responses/standard405.yaml
        '409':
          $ref: ./components/responses/standard409.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '501':
          $ref: ./components/responses/standard501.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
        '504':
          $ref: ./components/responses/standard504.yaml
  /event-subscriptions/{eventSubscriptionId}:
    get:
      tags:
        - event subscriptions
      summary: Get event subscription
      description: Get event subscription by id.
      operationId: getEventSubscription
      parameters:
        - $ref: ./components/parameters/event_subscription_id.yaml
        - $ref: ./components/parameters/header/correlation.yaml
      responses:
        '200':
          description: Get event subscriptions.
          headers:
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
          content:
            application/json:
              schema:
                $ref: ./components/schemas/EventSubscription.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '404':
          $ref: ./components/responses/standard404.yaml
        '405':
          $ref: ./components/responses/standard405.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '501':
          $ref: ./components/responses/standard501.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
        '504':
          $ref: ./components/responses/standard504.yaml
    put:
      tags:
        - event subscriptions
      summary: Update event subscription
      description: Update event subscription.
      operationId: updateEventSubscription
      parameters:
        - $ref: ./components/parameters/event_subscription_id.yaml
        - $ref: ./components/parameters/header/correlation.yaml
      requestBody:
        content:
          application/json:
            schema:
              $ref: ./components/schemas/EventSubscription.yaml
            example:
              eventTypes:
                - order:created
                - order:partiallyFilled
              callbackUrl: /ttpAPI/notifications/order-placement/
      responses:
        '204':
          description: Successfully updated (empty response).
          headers:
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '404':
          $ref: ./components/responses/standard404.yaml
        '405':
          $ref: ./components/responses/standard405.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '501':
          $ref: ./components/responses/standard501.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
        '504':
          $ref: ./components/responses/standard504.yaml
    delete:
      tags:
        - event subscriptions
      summary: Delete event subscription
      description: Delete event subscription by id.
      operationId: deleteEventSubscription
      parameters:
        - $ref: ./components/parameters/event_subscription_id.yaml
        - $ref: ./components/parameters/header/correlation.yaml
      responses:
        '204':
          description: Successfully deleted.
          headers:
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '404':
          $ref: ./components/responses/standard404.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '501':
          $ref: ./components/responses/standard501.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
        '504':
          $ref: ./components/responses/standard504.yaml
  /event-subscriptions/{eventSubscriptionId}/event-notifications:
    get:
      tags:
        - event notifications aggregated polling
      summary: Get event notifications list
      description: Get aggregated event notification list.
      operationId: listEventSubscriptionEventNotifications
      parameters:
        - $ref: ./components/parameters/cursor.yaml
        - $ref: ./components/parameters/limit.yaml
        - $ref: ./components/parameters/header/correlation.yaml
        - $ref: ./components/parameters/event_subscription_id.yaml
        - $ref: ./components/parameters/from_event_date_time.yaml
      responses:
        '200':
          description: List of event notifications.
          headers:
            X-Correlation-ID:
              $ref: ./components/headers/X-Correlation-ID.yaml
            X-Next-Cursor:
              $ref: ./components/headers/X-Next-Cursor.yaml
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./components/schemas/EventNotification.yaml
        '400':
          $ref: ./components/responses/standard400.yaml
        '401':
          $ref: ./components/responses/standard401.yaml
        '403':
          $ref: ./components/responses/standard403.yaml
        '404':
          $ref: ./components/responses/standard404.yaml
        '405':
          $ref: ./components/responses/standard405.yaml
        '429':
          $ref: ./components/responses/standard429.yaml
        '500':
          $ref: ./components/responses/standard500.yaml
        '501':
          $ref: ./components/responses/standard501.yaml
        '503':
          $ref: ./components/responses/standard503.yaml
        '504':
          $ref: ./components/responses/standard504.yaml
components:
  schemas: {}
  responses: {}
  parameters: {}
  headers: {}
  securitySchemes: {}
